[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dumatebench-cli"
version = "0.1.0"
description = "DuMateBench harbor-style CLI: build task images, run your agent, collect rewards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "PyYAML>=6.0",
]

[project.scripts]
dumate = "dumatebench_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dumatebench_cli"]
