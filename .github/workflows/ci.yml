name: Code CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -e dumatebench_cli

      - name: Compile Python sources
        run: python -m compileall -q dumatebench dumatebench_cli leaderboard

      - name: Run repository-wide pytest suite
        run: python -m pytest -q

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI and Harbor
        run: |
          python -m pip install --disable-pip-version-check -e dumatebench_cli
          python -m pip install --disable-pip-version-check -r leaderboard/ci/requirements.txt

      - name: Run Docker and Harbor smoke E2E
        run: python .github/scripts/docker_harbor_smoke.py
