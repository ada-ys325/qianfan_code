name: Code CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML pytest
          python -m pip install --disable-pip-version-check -r dumatebench/requirements.txt
          python -m pip install --disable-pip-version-check -e dumatebench_cli

      - name: Compile Python sources
        run: python -m compileall -q dumatebench dumatebench_cli leaderboard

      - name: Run submission validator tests
        env:
          PYTHONPATH: dumatebench_cli
        run: python -m unittest discover -s leaderboard/ci -p 'test_*.py'

      - name: Run Harbor integration tests
        env:
          PYTHONPATH: dumatebench_cli
        run: python -m unittest discover -s dumatebench_cli/tests -p 'test_*.py'

      # Discovery rather than a hand-picked module list: a green run here means
      # the whole dumatebench suite passed, not a curated subset of it.
      - name: Run runner and evaluator tests
        env:
          PYTHONPATH: dumatebench_cli
        run: python -m unittest discover -s dumatebench/tests -p 'test_*.py'

      # The Excel judge ships its own pytest suite and imports ``excel_judge`` as
      # a top-level package, so it needs its own root on PYTHONPATH.
      - name: Run Excel judge tests
        env:
          PYTHONPATH: dumatebench/evaluator/excel_llm_judge
        run: python -m pytest dumatebench/evaluator/excel_llm_judge/tests -q
