name: Code CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile Python sources
        run: python -m compileall -q dumatebench dumatebench_cli leaderboard

      - name: Run submission validator tests
        env:
          PYTHONPATH: dumatebench_cli
        run: python -m unittest discover -s leaderboard/ci -p 'test_*.py'

      - name: Run stable runner and evaluator tests
        env:
          PYTHONPATH: dumatebench_cli
        run: >-
          python -m unittest
          dumatebench.tests.test_adapter_runner
          dumatebench.tests.test_smoke_task_evaluator
