schema_version: "0.1"
task_id: "reasoning_probe_quick_task"
task_name: "Reasoning probe quick smoke"
split: "dev"
difficulty: "L0"
tags:
  - reasoning-probe

agent:
  timeout_sec: 60
  user: "agent"
  workdir: "/workspace"
  direct_shell: true
  runner: "dumatebench/agents/command_agent.py"
  runtime: "in_container"

environment:
  backend: "docker-compose"
  dockerfile: "environment/Dockerfile"
  compose_file: "environment/docker-compose.yaml"
  cpus: 1
  memory_mb: 4096
  storage_mb: 4000
  allow_internet: true
  allow_package_install: true
  env:
    DUMATE_TASK_SEED: "20260803"

evaluation:
  entrypoint: "evaluator/evaluator.py"
  checks_file: "evaluator/checks.yaml"
  hidden_tests: false
  metrics:
    - complete_pass
    - partial_pass
