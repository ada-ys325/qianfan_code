checks:
  - id: expected_output_3_exists
    description: 检查映射到评估目录的输出文件是否存在：run_outputs/character_sheets/三视图_女店员.png
    type: evaluate_file_exist
    weight: 0.1
    args: {"file": "run_outputs/character_sheets/三视图_女店员.png"}
  - id: female_sheet_exists
    description: 女店员三视图图片已生成
    type: evaluate_file_exist
    weight: 0.1
    args: {"file": "run_outputs/character_sheets/三视图_男顾客.png"}
  - id: male_sheet_exists
    description: 男顾客三视图图片已生成
    type: evaluate_file_exist
    weight: 0.1
    args: {"file": "run_outputs/character_sheets/三视图_男顾客.png"}
  - id: notes_file_exists
    description: 三视图说明文本文件已生成
    type: evaluate_file_exist
    weight: 0.1
    args: {"file": "run_outputs/character_sheets/三视图说明.txt"}
  - id: notes_contains_views
    description: 说明文本包含正面/侧面/背面三个视角关键词
    type: evaluate_contain
    weight: 0.3
    args: {"file": "run_outputs/character_sheets/三视图说明.txt", "doc_type": "txt", "keywords": ["正面", "侧面", "背面"]}
  - id: notes_contains_characters
    description: 说明文本包含两位角色名称
    type: evaluate_contain
    weight: 0.3
    args: {"file": "run_outputs/character_sheets/三视图说明.txt", "doc_type": "txt", "keywords": ["女店员", "男顾客"]}
