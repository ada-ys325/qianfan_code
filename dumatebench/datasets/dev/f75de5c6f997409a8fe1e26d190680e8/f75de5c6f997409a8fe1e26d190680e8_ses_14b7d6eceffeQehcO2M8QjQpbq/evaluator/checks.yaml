checks:
  - id: report_exists
    description: 生成的报告文件存在
    type: evaluate_file_exist
    weight: 0.2
    args: {"file": "run_outputs/reports/大学学生选课系统设计与分析报告.docx"}
  - id: report_format_valid
    description: 报告为有效的 docx 文件
    type: evaluate_file_format_valid
    weight: 0.2
    args: {"file": "run_outputs/reports/大学学生选课系统设计与分析报告.docx", "doc_type": "docx"}
  - id: report_contains_main_sections
    description: 报告包含所有要求的主要章节标题
    type: evaluate_contain
    weight: 0.2
    args: {"file": "run_outputs/reports/大学学生选课系统设计与分析报告.docx", "doc_type": "docx", "keywords": ["研究目标", "需求分析", "数据字典", "总体设计", "详细设计", "测试用例"]}
  - id: report_contains_domain_entities
    description: 报告涉及选课系统核心业务实体（学生、课程、选课等）
    type: evaluate_contain
    weight: 0.2
    args: {"file": "run_outputs/reports/大学学生选课系统设计与分析报告.docx", "doc_type": "docx", "keywords": ["学生", "课程", "选课", "系统"]}
  - id: report_contains_login_flow
    description: 详细设计/流程图部分包含相关业务流程叙述
    type: evaluate_contain
    weight: 0.2
    args: {"file": "run_outputs/reports/大学学生选课系统设计与分析报告.docx", "doc_type": "docx", "keywords": ["登录", "注册", "选择", "生成", "打印"]}
