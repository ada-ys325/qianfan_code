schema_version: "0.1"
task_id: "odyssey_2_12_smoke"
task_name: "Add converted handwritten meeting notes to calendar"
split: "dev"
difficulty: "L1"
tags:
  - pdf
  - ocr
  - calendar
  - shell
  - network-instability
  - api-instability

agent:
  timeout_sec: 900
  user: "agent"
  workdir: "/workspace"
  direct_shell: true
  runner: "dumatebench/agents/command_agent.py"
  runtime: "in_container"
  protocol:
    type: "json_command_loop"
    command_field: "command"
    finish_field: "finish"
  trusted_base_urls:
    - "https://cn.huayanapi.com:27502/v1"

environment:
  backend: "docker-compose"
  dockerfile: "environment/Dockerfile"
  compose_file: "environment/docker-compose.yaml"
  cpus: 2
  memory_mb: 4096
  storage_mb: 12000
  allow_internet: true
  allow_package_install: true
  env:
    DUMATE_TASK_SEED: "20260706"
    DUMATE_NETWORK_FAULT_CONFIG: "/opt/dumate/network_faults.yaml"
    DUMATE_TOOL_FAULT_CONFIG: "/opt/dumate/tool_faults.yaml"
    DUMATE_TRUSTED_BASE_URLS: "https://cn.huayanapi.com:27502/v1"
  network_faults: "network_faults.yaml"
  tool_faults: "tool_faults.yaml"

complexity:
  missing_tools:
    - tesseract-ocr
  missing_packages:
    - icalendar
    - requests
    - pypdf
  unstable_services:
    - network-stack
    - wrapped-ocr-tool
    - wrapped-calendar-tool
  noisy_workspace: true
  protected_files:
    - "workspace_seed/**"
  allowed_write_paths:
    - "/outputs/**"
    - "/workspace/**"

evaluation:
  entrypoint: "evaluator/evaluator.py"
  checks_file: "evaluator/checks.yaml"
  hidden_tests: false
  metrics:
    - complete_pass
    - partial_pass
    - environment_recovery
    - network_recovery
