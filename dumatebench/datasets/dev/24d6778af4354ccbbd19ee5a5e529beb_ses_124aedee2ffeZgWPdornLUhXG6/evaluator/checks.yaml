checks:
  - id: output_pptx_exists
    description: 优化后的 PPTX 文件存在于指定输出路径
    type: evaluate_file_exist
    weight: 0.4
    args: {"file": "run_outputs/pptx/演示文稿9_优化.pptx"}
  - id: output_pptx_format_valid
    description: 输出文件是有效的 pptx 格式
    type: evaluate_file_format_valid
    weight: 0.4
    args: {"file": "run_outputs/pptx/演示文稿9_优化.pptx", "doc_type": "pptx"}
  - id: no_extra_output_files
    description: 输出目录仅包含预期交付文件，保持干净
    type: evaluate_no_extra_files
    weight: 0.2
    args: {"root": "run_outputs/", "expected_files": ["run_outputs/pptx/演示文稿9_优化.pptx"]}
